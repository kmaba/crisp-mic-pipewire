# Crisp mic chain (WebRTC 2.1 + Studio 48kHz EQ + Smooth Double-Talk + Strong System Audio Block)
context.modules = [
  {   name = libpipewire-module-echo-cancel
      flags = [ nofail ]
      args = {
          library.name = aec/libspa-aec-webrtc2
          audio.rate = 48000
          audio.channels = 2
          capture.props = {
              node.name        = "capture.raw_mic"
              node.description = "Raw laptop mic (internal)"
              node.target      = "alsa_input.pci-0000_06_00.6.analog-stereo"
              node.passive     = true
              audio.position   = [ FL FR ]
          }
          source.props = {
              node.name        = "mic_crisp"
              node.description = "Crisp Mic (no speaker pickup)"
              media.class      = "Audio/Source"
          }
          sink.props = {
              node.name        = "pebble_out"
              node.description = "Pebbles (microphone-echo-cancelling)"
              media.class      = "Audio/Sink"
          }
          playback.props = {
              node.name        = "playback.speakers"
              node.description = "Speakers playback (Pebble jack)"
              node.target      = "alsa_output.pci-0000_06_00.6.analog-stereo"
              node.passive     = true
              audio.position   = [ FL FR ]
          }
          aec.args = "{ webrtc.high_pass_filter = true webrtc.noise_suppression = true webrtc.noise_suppression.level = moderate webrtc.linear_aec_ns = true webrtc.studio_eq = true webrtc.transient_suppression = false webrtc.mobile_mode = false }"
      }
  }
]
