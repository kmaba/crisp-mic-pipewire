# Crisp mic chain (WebRTC 2.1 + full-bandwidth double-talk AEC3)
#
# Made for the internal laptop mic + Creative Pebble V3 speakers on the
# analog jack. Two nodes are created:
#
#   * mic_crisp   — virtual SOURCE: the internal mic with WebRTC 2.1 AEC3
#                   echo cancellation (kills everything your speakers play,
#                   including music & podcasts), linear-AEC-guided noise
#                   suppression (kills fan, open-window wind, and breath),
#                   and full-band nearend double-talk tuning (prevents the
#                   >1.8 kHz low-pass "underwater" voice clamp when talking
#                   while music or podcasts are playing).
#                   No AGC, no transient suppression => keyboard clacks stay,
#                   distant sounds are NOT boosted.
#
#   * pebble_out  — virtual SINK: everything played here goes straight to
#                   the Pebbles AND is fed to the canceller as the exact
#                   "far end" reference.
#
context.modules = [
  {   name = libpipewire-module-echo-cancel
      flags = [ nofail ]
      args = {
          library.name = aec/libspa-aec-webrtc2
          # ---- stream that taps the physical mic ------------------------
          capture.props = {
              node.name        = "capture.raw_mic"
              node.description = "Raw laptop mic (internal)"
              node.target      = "alsa_input.pci-0000_06_00.6.analog-stereo"
              node.passive     = true
              audio.position   = [ FL FR ]
          }
          # ---- what apps record from ------------------------------------
          source.props = {
              node.name        = "mic_crisp"
              node.description = "Crisp Mic (no speaker pickup)"
              media.class      = "Audio/Source"
          }
          # ---- what apps play into (goes to Pebbles + reference) ---------
          sink.props = {
              node.name        = "pebble_out"
              node.description = "Pebbles (microphone-echo-cancelling)"
              media.class      = "Audio/Sink"
          }
          # ---- stream that feeds the physical speakers -------------------
          playback.props = {
              node.name        = "playback.speakers"
              node.description = "Speakers playback (Pebble jack)"
              node.target      = "alsa_output.pci-0000_06_00.6.analog-stereo"
              node.passive     = true
              audio.position   = [ FL FR ]
          }
          # ---- WebRTC 2.1 canceller + double-talk toggles ----------------
          # crisp_doubletalk keeps >2kHz voice open while music plays;
          # the nearend_*_transparent/suppress values above are pushed
          # near-transparent so the non-linear suppressor barely touches
          # voice during double-talk (linear filter still cancels music
          # when you are silent via normal_tuning).
          aec.args = "{ webrtc.high_pass_filter = false webrtc.noise_suppression = true webrtc.noise_suppression.level = low webrtc.linear_aec_ns = true webrtc.crisp_doubletalk = true webrtc.nearend_hf_transparent = 8.0 webrtc.nearend_hf_suppress = 12.0 webrtc.nearend_lf_transparent = 8.0 webrtc.nearend_lf_suppress = 12.0 webrtc.nearend_snr_threshold = 4.0 webrtc.nearend_trigger_blocks = 1 webrtc.gain_control = false webrtc.gain_control1.enabled = false webrtc.gain_control2.enabled = false webrtc.mobile_mode = false webrtc.transient_suppression = false }"
      }
  }
]
