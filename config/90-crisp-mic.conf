# Crisp Mic — simplified v6 (mono)
context.modules = [
  {   name = libpipewire-module-echo-cancel
      flags = [ nofail ]
      args = {
          library.name = aec/libspa-aec-webrtc
          capture.props = {
              node.name        = "capture.raw_mic"
              node.description = "Raw laptop mic (internal)"
              node.target      = "alsa_input.pci-0000_06_00.6.analog-stereo"
              node.passive     = true
              audio.position   = [ MONO ]
          }
          source.props = {
              node.name        = "mic_crisp"
              node.description = "Crisp Mic"
              media.class      = "Audio/Source"
              audio.position   = [ MONO ]
              priority.session = 2500
          }
          sink.props = {
              node.name        = "pebble_out"
              node.description = "Pebbles (microphone-echo-cancelling)"
              media.class      = "Audio/Sink"
              audio.position   = [ FL FR ]
          }
          playback.props = {
              node.name        = "playback.speakers"
              node.description = "Speakers playback (Pebble jack)"
              node.target      = "alsa_output.pci-0000_06_00.6.analog-stereo"
              node.passive     = true
              audio.position   = [ FL FR ]
          }
          aec.args = "{ webrtc.high_pass_filter = true webrtc.noise_suppression = true webrtc.gain_control = false webrtc.voice_detection = false webrtc.transient_suppression = false webrtc.extended_filter = true }"
      }
  }
]
